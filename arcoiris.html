<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti 🌈✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --c-rojo: #ff3366;
            --c-naranja: #ff9933;
            --c-amarillo: #ffcc00;
            --c-verde: #00cc99;
            --c-azul: #0099ff;
            --c-morado: #9966ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            user-select: none;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Aura dinámica */
        #bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(5,5,8,1) 70%);
            z-index: 0;
            transition: background 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #canvas-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        h1 {
            font-weight: 800;
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--c-rojo), var(--c-naranja), var(--c-amarillo), var(--c-verde), var(--c-azul), var(--c-morado));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 10px 30px rgba(255, 255, 255, 0.1);
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        p.instruccion {
            font-weight: 400;
            font-size: 14px;
            color: #8395a7;
            margin-bottom: 60px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .arcoiris-container {
            position: relative;
            width: 360px;
            height: 190px;
            margin-bottom: 60px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .arc {
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center bottom;
            /* Preparación para la animación de dibujo mágico */
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dibujarArco 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Retrasos para que se dibujen uno tras otro */
        .arc:nth-child(1) { animation-delay: 0.1s; }
        .arc:nth-child(2) { animation-delay: 0.3s; }
        .arc:nth-child(3) { animation-delay: 0.5s; }
        .arc:nth-child(4) { animation-delay: 0.7s; }
        .arc:nth-child(5) { animation-delay: 0.9s; }
        .arc:nth-child(6) { animation-delay: 1.1s; }

        @keyframes dibujarArco {
            to { stroke-dashoffset: 0; }
        }

        .arc:hover {
            stroke-width: 22;
            transform: scale(1.04);
        }

        .arc:active {
            stroke-width: 12;
            transform: scale(0.96);
        }

        .premium-box {
            width: 90%;
            max-width: 500px;
            min-height: 130px;
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.8);
            margin-bottom: 50px;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .premium-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: all 0.8s ease;
        }

        .premium-box.active::before {
            left: 100%;
            transition: left 1s ease-in-out;
        }

        .halago-texto {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.6;
            margin: 0;
            color: #ffffff;
            min-height: 70px;
            display: flex;
            align-items: center;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 24px;
            background-color: #ffffff;
            margin-left: 6px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
            border-radius: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .firma {
            font-family: 'Dancing Script', cursive;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            transition: color 0.5s ease;
        }

    </style>
</head>
<body>

    <div id="bg-glow"></div>
    <canvas id="canvas-particles"></canvas>

    <div class="content-wrapper">
        <h1>Tu Arcoíris</h1>
        <p class="instruccion">Toca un color y descubre la magia</p>

        <div class="arcoiris-container">
            <svg viewBox="0 0 360 180" id="arcoirisSVG">
                <path d="M 20 170 A 160 160 0 0 1 340 170" fill="none" stroke="var(--c-rojo)" stroke-width="16" class="arc" onclick="activarMagia(event, 'var(--c-rojo)', this)" stroke-linecap="round"/>
                <path d="M 48 170 A 132 132 0 0 1 312 170" fill="none" stroke="var(--c-naranja)" stroke-width="16" class="arc" onclick="activarMagia(event, 'var(--c-naranja)', this)" stroke-linecap="round"/>
                <path d="M 76 170 A 104 104 0 0 1 284 170" fill="none" stroke="var(--c-amarillo)" stroke-width="16" class="arc" onclick="activarMagia(event, 'var(--c-amarillo)', this)" stroke-linecap="round"/>
                <path d="M 104 170 A 76 76 0 0 1 256 170" fill="none" stroke="var(--c-verde)" stroke-width="16" class="arc" onclick="activarMagia(event, 'var(--c-verde)', this)" stroke-linecap="round"/>
                <path d="M 132 170 A 48 48 0 0 1 228 170" fill="none" stroke="var(--c-azul)" stroke-width="16" class="arc" onclick="activarMagia(event, 'var(--c-azul)', this)" stroke-linecap="round"/>
                <path d="M 160 170 A 20 20 0 0 1 200 170" fill="none" stroke="var(--c-morado)" stroke-width="16" class="arc" onclick="activarMagia(event, 'var(--c-morado)', this)" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="premium-box" id="cajaHalago">
            <p class="halago-texto"><span id="textoEfecto">Toca un color, mi amor</span><span class="cursor" id="cursorM"></span></p>
        </div>

        <div class="firma" id="firmaAmor">Hecho con mucho amor ❤️</div>
    </div>

    <script>
        const halagos = [
            "Eres la persona más hermosa del universo entero.",
            "Tienes una sonrisa que ilumina mi día por completo.",
            "Me encanta tu forma de ser, eres única y especial.",
            "Eres mi lugar favorito en todo el mundo.",
            "Tus ojos son lo más lindo que he visto en mi vida.",
            "Haces que todo sea mejor con solo estar ahí.",
            "Me haces el hombre más feliz del planeta.",
            "Tienes un corazón de oro puro, vales oro.",
            "Amo cada pequeño detalle de ti, eres perfecta para mí.",
            "Tu risa es mi melodía favorita en la vida.",
            "Eres mi princesa hermosa y siempre lo serás.",
            "Contigo todos los días se vuelven mágicos.",
            "Eres el mejor regalo que me pudo dar la vida.",
            "Nadie se compara contigo, eres una en un millón.",
            "Adoro tu ternura y me fascinan tus abrazos.",
            "Eres la dueña absoluta de todos mis suspiros.",
            "Me vuelves loco con lo preciosa que eres.",
            "Mi vida es mil veces más bonita desde que tú estás.",
            "Eres un sueño hecho realidad para mí.",
            "Cada día que pasa me enamoras un poquito más.",
            "Tu carita es mi obra de arte favorita.",
            "No hay nadie en el planeta entero que brille más que tú."
        ];

        let ultimoIndice = -1;
        let audioCtx = null;
        let typeWriterTimeout;

        // --- SISTEMA DE PARTÍCULAS (EXPLOSIONES, MAGIA Y AMBIENTE) ---
        const canvas = document.getElementById('canvas-particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let ambientParticles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Luciérnagas ambientales de fondo
        class AmbientParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
                this.color = `rgba(255, 255, 255, ${this.alpha})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ffffff';
                ctx.fill();
            }
        }

        for(let i=0; i<40; i++) ambientParticles.push(new AmbientParticle());

        // Partículas de explosión y rastro de ratón
        class Particle {
            constructor(x, y, color, isTrail = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isTrail = isTrail;
                const angle = Math.random() * Math.PI * 2;
                const speed = isTrail ? Math.random() * 1.5 : Math.random() * 7 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = isTrail ? (Math.random() * 0.05 + 0.02) : (Math.random() * 0.02 + 0.01);
                this.size = isTrail ? Math.random() * 2 + 1 : Math.random() * 5 + 1.5;
            }
            update() {
                if (!this.isTrail) this.vy += 0.12; // Gravedad solo para explosiones
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // Rastro de ratón (Polvo de hadas)
        window.addEventListener('mousemove', (e) => {
            for(let i=0; i<2; i++) {
                particles.push(new Particle(e.clientX, e.clientY, '#ffffff', true));
            }
        });
        // Para celulares
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            for(let i=0; i<2; i++) {
                particles.push(new Particle(touch.clientX, touch.clientY, '#ffffff', true));
            }
        });

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar fondo ambiental
            ambientParticles.forEach(p => { p.update(); p.draw(); });

            // Dibujar explosiones y estelas
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        function createExplosion(x, y, color) {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // --- SONIDO CRISTALINO ---
        function playPremiumTone() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000 + Math.random() * 800, audioCtx.currentTime); 
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }

        // --- EFECTO MÁQUINA DE ESCRIBIR ---
        function typeWriterEffect(texto, color) {
            const spanTexto = document.getElementById('textoEfecto');
            const cursor = document.getElementById('cursorM');
            
            clearTimeout(typeWriterTimeout);
            spanTexto.innerHTML = '';
            spanTexto.style.color = color;
            cursor.style.backgroundColor = color;
            cursor.style.boxShadow = `0 0 10px ${color}`;
            
            let i = 0;
            function type() {
                if (i < texto.length) {
                    spanTexto.innerHTML += texto.charAt(i);
                    i++;
                    typeWriterTimeout = setTimeout(type, 45); 
                }
            }
            type();
        }

        // --- MAGIA PRINCIPAL ---
        function activarMagia(evento, varColor, elementoPath) {
            const caja = document.getElementById('cajaHalago');
            const bgGlow = document.getElementById('bg-glow');
            const firma = document.getElementById('firmaAmor');
            
            // Resetear y aplicar brillo al arco tocado
            document.querySelectorAll('.arc').forEach(arc => {
                arc.style.filter = 'none';
                arc.style.opacity = '0.3';
            });
            elementoPath.style.filter = `drop-shadow(0 0 35px ${varColor})`;
            elementoPath.style.opacity = '1';

            const colorReal = getComputedStyle(document.documentElement).getPropertyValue(varColor.replace('var(', '').replace(')', '')).trim();

            // Fondo iluminado
            bgGlow.style.background = `radial-gradient(circle at center, ${colorReal}2A 0%, rgba(5,5,8,1) 85%)`;
            
            // Caja reacciona
            caja.style.borderColor = `${colorReal}66`;
            caja.style.boxShadow = `0 30px 60px -10px rgba(0, 0, 0, 0.8), 0 0 40px ${colorReal}33`;
            
            // Reiniciar animación del destello superior de la caja
            caja.classList.remove('active');
            void caja.offsetWidth; // Trigger reflow
            caja.classList.add('active');

            // Colorear firma
            firma.style.color = colorReal;
            firma.style.textShadow = `0 0 15px ${colorReal}`;

            // Explosión y sonido
            playPremiumTone();
            
            // Manejar coordenadas en móvil y PC
            let x = evento.clientX || (evento.touches && evento.touches[0].clientX);
            let y = evento.clientY || (evento.touches && evento.touches[0].clientY);
            
            // Si el evento no trae coordenadas precisas, centrar la explosión
            if(!x) {
                const rect = elementoPath.getBoundingClientRect();
                x = rect.left + rect.width / 2;
                y = rect.top + rect.height / 2;
            }
            createExplosion(x, y, colorReal);

            // Seleccionar halago aleatorio sin repetir el anterior
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * halagos.length);
            } while (randomIndex === ultimoIndice);
            ultimoIndice = randomIndex;

            typeWriterEffect(halagos[randomIndex], colorReal);
        }
    </script>
</body>
</html>
